name: Weekly Price Scrape

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 7am PT (14:00 UTC)
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug supabase version
        run: python -c "import supabase; print(supabase.__version__)"

      - name: Run Superstore scraper
        run: python -m src.scrapers.superstore

      - name: Run Save-On scraper
        run: python -m src.scrapers.saveon